name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate CLI script syntax
        run: bash -n ./itte

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Lint web app
        working-directory: web
        run: npm run lint

      - name: Validate Prisma schema
        working-directory: web
        run: npx prisma validate
